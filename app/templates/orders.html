{% extends "base.html" %}
{% block content %}
  <section class="page-header">
    <div>
      <h1>Encomendas</h1>
    </div>
    <div>
      <a class="pill toggle" href="{{ url_for('orders_manage') }}" data-sound="next">Gestao por fornecedor</a>
    </div>
  </section>

  <section class="panel">
    <h2>Adicionar item em falta</h2>
    <form method="post" class="form order-compose" id="order-compose">
      <input type="hidden" name="selected_items" id="selected-items-hidden" />
      <input type="hidden" name="ordered_at" id="ordered-at-hidden" />
      <button class="primary" type="submit" data-sound="save">Adicionar selecionados</button>
    </form>
    <div id="order-guided-mode">
      <div class="form grid-form">
        <label class="full" for="order-filter-search">
          Pesquisa
          <input type="search" id="order-filter-search" placeholder="Pesquisar item" aria-label="Pesquisar item" />
        </label>
        <div class="full">
          <label>Fornecedor</label>
          <div class="todo-area-tabs" id="order-filter-guided-supplier-pills"></div>
        </div>
        <div class="full">
          <label>Zona</label>
          <div class="quick-picks" id="order-filter-guided-zone-pills"></div>
        </div>
      </div>
    </div>
    <div class="order-card-grid" id="order-item-results"></div>
  </section>

  <section class="panel">
    <h2>Lista pendente</h2>
    <div class="table responsive-table" id="pending-by-supplier"></div>
  </section>

  <script>
    const orderItems = {{ items|tojson }};
    let pendingOrders = {{ orders|tojson }};
    const selectedItemsHidden = document.getElementById("selected-items-hidden");
    const results = document.getElementById("order-item-results");
    const orderedAtHidden = document.getElementById("ordered-at-hidden");
    const filterSearch = document.getElementById("order-filter-search");
    const guidedSupplierPills = document.getElementById("order-filter-guided-supplier-pills");
    const guidedZonePills = document.getElementById("order-filter-guided-zone-pills");
    const pendingBySupplier = document.getElementById("pending-by-supplier");

    const getDeviceDateISO = () => {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    };

    const relativeLastDate = (value) => {
      if (!value) return "Nunca pedido";
      const target = new Date(`${value}T00:00:00`);
      if (Number.isNaN(target.getTime())) return `Ultima vez: ${value}`;

      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const diffMs = today.getTime() - target.getTime();
      const diffDays = Math.max(0, Math.floor(diffMs / 86400000));

      if (diffDays === 0) return "Hoje";
      if (diffDays === 1) return "Ontem";
      if (diffDays < 7) return `${diffDays} dias atras`;
      if (diffDays < 14) return "1 semana atras";
      if (diffDays < 30) return `${Math.floor(diffDays / 7)} semanas atras`;
      if (diffDays < 60) return "1 mes atras";
      return `${Math.floor(diffDays / 30)} meses atras`;
    };
    const relativePendingDate = (value) => {
      if (!value) return "sem data";
      const target = new Date(`${value}T00:00:00`);
      if (Number.isNaN(target.getTime())) return `adicionado em ${value}`;

      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const diffMs = today.getTime() - target.getTime();
      const diffDays = Math.max(0, Math.floor(diffMs / 86400000));

      if (diffDays === 0) return "adicionado hoje";
      if (diffDays === 1) return "ha 1 dia";
      if (diffDays < 7) return `ha ${diffDays} dias`;
      if (diffDays < 14) return "ha 1 semana";
      if (diffDays < 30) return `ha ${Math.floor(diffDays / 7)} semanas`;
      if (diffDays < 60) return "ha 1 mes";
      return `ha ${Math.floor(diffDays / 30)} meses`;
    };
    const formatQtyDisplay = (value) => {
      const num = Number(value);
      if (!Number.isFinite(num)) return String(value ?? "");
      if (Number.isInteger(num)) return String(num);
      return num.toFixed(2).replace(/\.?0+$/, "");
    };

    const selectedItems = new Map();
    const itemById = new Map(orderItems.map((item) => [Number(item[0]), item]));
    const normalizeKey = (value) =>
      (value || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    const daysSinceDate = (value) => {
      if (!value) return null;
      const target = new Date(`${value}T00:00:00`);
      if (Number.isNaN(target.getTime())) return null;
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      return Math.max(0, Math.floor((today.getTime() - target.getTime()) / 86400000));
    };
    const uniqueTypes = [...new Set(orderItems.map((item) => item[2]).filter(Boolean))].sort();
    const SEARCH_DEBOUNCE_MS = 250;
    const zoneOptionsBySupplier = new Map(
      uniqueTypes.map((supplier) => [
        supplier,
        [...new Set(orderItems.filter((item) => item[2] === supplier).map((item) => item[4]).filter(Boolean))].sort(),
      ])
    );
    const filterState = {
      guidedSupplier: "",
      guidedZone: "",
    };

    const renderCards = () => {
      if (!results) return;
      const selectedGuidedSupplier = normalizeKey(filterState.guidedSupplier);
      const selectedGuidedZone = normalizeKey(filterState.guidedZone);
      const selectedSearch = normalizeKey(filterSearch?.value || "");

      if (!selectedGuidedSupplier) {
        results.innerHTML = '<div class="table-row empty">Selecione um fornecedor para continuar.</div>';
        return;
      }

      const filtered = orderItems.filter((item) => {
        const itemName = normalizeKey(item[1]);
        const itemSubtype = normalizeKey(item[4]);
        const itemSupplier = normalizeKey(item[2]);
        const guidedSupplierMatch = !selectedGuidedSupplier || itemSupplier === selectedGuidedSupplier;
        const guidedZoneMatch = !selectedGuidedZone || itemSubtype === selectedGuidedZone;
        const searchMatch =
          !selectedSearch ||
          itemName.includes(selectedSearch) ||
          itemSupplier.includes(selectedSearch) ||
          itemSubtype.includes(selectedSearch);
        return guidedSupplierMatch && guidedZoneMatch && searchMatch;
      });

      if (!filtered.length) {
        results.innerHTML = '<div class="table-row empty">Sem itens para esse filtro.</div>';
        return;
      }

      results.innerHTML = "";
      filtered.forEach((item) => {
        const id = item[0];
        const name = item[1];
        const supplier = item[2];
        const last = item[5];
        const selected = selectedItems.has(id);
        const selectedQty = selected ? selectedItems.get(id).qty : 1;

        const card = document.createElement("div");
        card.className = "order-item-card";
        card.setAttribute("role", "button");
        card.setAttribute("tabindex", "0");
        if (selected) card.classList.add("selected");
        const title = document.createElement("h4");
        title.textContent = name;
        const supplierText = document.createElement("p");
        supplierText.textContent = supplier;
        const lastText = document.createElement("small");
        lastText.textContent = relativeLastDate(last);
        const footer = document.createElement("div");
        footer.className = "order-item-footer";
        const qtyLabel = document.createElement("label");
        qtyLabel.textContent = "Qtd";
        const qtyInput = document.createElement("input");
        qtyInput.type = "number";
        qtyInput.min = "0.01";
        qtyInput.step = "0.01";
        qtyInput.value = String(selectedQty);
        qtyInput.className = "order-qty-input";
        const pick = document.createElement("span");
        pick.className = "pill toggle";
        pick.textContent = selected ? "Selecionado" : "Selecionar";
        footer.appendChild(qtyLabel);
        footer.appendChild(qtyInput);
        footer.appendChild(pick);
        card.appendChild(title);
        card.appendChild(supplierText);
        card.appendChild(lastText);
        card.appendChild(footer);

        const toggleSelection = () => {
          const qty = Math.max(0.01, Number(qtyInput.value || "1"));
          if (selectedItems.has(id)) {
            selectedItems.delete(id);
          } else {
            selectedItems.set(id, { item_id: id, qty });
          }
          renderCards();
        };

        qtyInput.addEventListener("click", (e) => e.stopPropagation());
        qtyInput.addEventListener("input", (e) => {
          e.stopPropagation();
          if (!selectedItems.has(id)) return;
          selectedItems.set(id, { item_id: id, qty: Math.max(0.01, Number(qtyInput.value || "1")) });
        });

        card.addEventListener("click", toggleSelection);
        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            toggleSelection();
          }
        });

        results.appendChild(card);
      });
    };

    const buildFilterPills = (host, values, selected, onPick) => {
      if (!host) return;
      host.textContent = "";
      [{ label: "Todas", value: "" }, ...values.map((value) => ({ label: value, value }))].forEach((entry) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `pill ${entry.value === selected ? "ok" : "toggle"}`;
        btn.textContent = entry.label;
        btn.addEventListener("click", () => onPick(entry.value));
        host.appendChild(btn);
      });
    };

    const renderGuidedPills = () => {
      buildFilterPills(guidedSupplierPills, uniqueTypes, filterState.guidedSupplier, (value) => {
        filterState.guidedSupplier = value;
        filterState.guidedZone = "";
        renderGuidedPills();
        renderCards();
      });
      const supplierZones = zoneOptionsBySupplier.get(filterState.guidedSupplier) || [];
      buildFilterPills(guidedZonePills, supplierZones, filterState.guidedZone, (value) => {
        filterState.guidedZone = value;
        renderGuidedPills();
        renderCards();
      });
    };
    let filterSearchTimer = null;
    filterSearch?.addEventListener("input", () => {
      window.clearTimeout(filterSearchTimer);
      filterSearchTimer = window.setTimeout(renderCards, SEARCH_DEBOUNCE_MS);
    });

    document.getElementById("order-compose")?.addEventListener("submit", (e) => {
      if (orderedAtHidden) orderedAtHidden.value = getDeviceDateISO();
      if (selectedItems.size === 0) {
        e.preventDefault();
        alert("Selecione pelo menos um item.");
        return;
      }

      const selectedEntries = [...selectedItems.values()];
      const riskyEntries = selectedEntries.filter((entry) => {
        const item = itemById.get(Number(entry.item_id));
        if (!item) return false;
        const supplierName = normalizeKey(item[2]);
        if (supplierName !== "mercado") return false;
        const lastPurchasedAt = item[6];
        const days = daysSinceDate(lastPurchasedAt);
        return days !== null && days < 3;
      });

      for (const entry of riskyEntries) {
        const item = itemById.get(Number(entry.item_id));
        if (!item) continue;
        const days = daysSinceDate(item[6]);
        const message =
          days === 0
            ? `${item[1]} foi comprado hoje. Deseja mesmo encomendar novamente?`
            : `${item[1]} foi comprado ha ${days} dia(s). Deseja mesmo encomendar novamente?`;
        const confirmed = window.confirm(message);
        if (!confirmed) {
          selectedItems.delete(Number(entry.item_id));
        }
      }

      if (selectedItems.size === 0) {
        e.preventDefault();
        renderCards();
        alert("Nenhum item confirmado para envio.");
        return;
      }

      if (selectedItemsHidden) {
        selectedItemsHidden.value = JSON.stringify([...selectedItems.values()]);
      }
    });

    const renderPendingBySupplier = () => {
      if (!pendingBySupplier) return;
      if (!pendingOrders.length) {
        pendingBySupplier.innerHTML = '<div class="table-row empty">Nenhum item pendente.</div>';
        return;
      }

      const grouped = new Map();
      pendingOrders.forEach((row) => {
        const supplier = row[1] || "-";
        if (!grouped.has(supplier)) grouped.set(supplier, []);
        grouped.get(supplier).push(row);
      });

      pendingBySupplier.innerHTML = "";
      [...grouped.entries()].forEach(([supplier, rows]) => {
        const group = document.createElement("details");
        group.className = "filter-accordion pending-supplier-accordion";
        group.open = true;

        const summary = document.createElement("summary");
        const title = document.createElement("span");
        title.textContent = supplier;
        const count = document.createElement("small");
        count.textContent = `${rows.length} item(ns)`;
        summary.appendChild(title);
        summary.appendChild(count);
        group.appendChild(summary);

        const list = document.createElement("div");
        list.className = "pending-card-grid";
        rows.forEach((o) => {
          const card = document.createElement("article");
          card.className = "pending-order-card";
          const orderId = Number(o[0]);
          card.innerHTML = `
            <h4>${o[2]}</h4>
            <div class="pending-order-actions">
              <label>
                Quantidade
                <input type="number" min="0.01" step="0.01" value="${Number(o[3])}" data-pending-qty="${orderId}" />
              </label>
              <button type="button" class="pill toggle" data-pending-save="${orderId}" aria-label="Guardar quantidade" title="Guardar quantidade">
                <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i>
              </button>
              <button type="button" class="pill warn" data-pending-remove="${orderId}" aria-label="Remover item" title="Remover item">
                <i class="fa-solid fa-trash" aria-hidden="true"></i>
              </button>
            </div>
            <small>${relativePendingDate(o[4])}</small>
          `;
          list.appendChild(card);
        });
        group.appendChild(list);
        pendingBySupplier.appendChild(group);
      });

      pendingBySupplier.querySelectorAll("[data-pending-save]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const orderId = Number(btn.getAttribute("data-pending-save"));
          const qtyField = pendingBySupplier.querySelector(`[data-pending-qty="${orderId}"]`);
          const qty = Math.max(0.01, Number(qtyField?.value || "0"));
          if (!Number.isFinite(qty) || qty <= 0) return;
          const res = await fetch(`/orders/${orderId}/qty`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ qty }),
          });
          if (!res.ok) return;
          const idx = pendingOrders.findIndex((x) => Number(x[0]) === orderId);
          if (idx >= 0) pendingOrders[idx][3] = qty;
          renderPendingBySupplier();
        });
      });

      pendingBySupplier.querySelectorAll("[data-pending-remove]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const orderId = Number(btn.getAttribute("data-pending-remove"));
          const res = await fetch(`/orders/${orderId}/remove`, { method: "POST" });
          if (!res.ok) return;
          pendingOrders = pendingOrders.filter((x) => Number(x[0]) !== orderId);
          renderPendingBySupplier();
        });
      });
    };

    if (orderedAtHidden) orderedAtHidden.value = getDeviceDateISO();
    renderGuidedPills();
    renderCards();
    renderPendingBySupplier();
  </script>
{% endblock %}
