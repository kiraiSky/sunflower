{% extends "base.html" %}
{% block content %}
  <section class="page-header">
    <div>
      <h1>Fornecedores</h1>
      <p>Gestão de contactos e notas.</p>
    </div>
  </section>

  <section class="panel">
    <h2>Novo fornecedor</h2>
    <form method="post" class="form grid-form">
      <label>
        Nome
        <input name="name" required />
      </label>
      <label>
        Telefone
        <input name="phone" />
      </label>
      <label>
        Email
        <input name="email" type="email" />
      </label>
      <label class="full">
        Notas
        <textarea name="notes" rows="2"></textarea>
      </label>
      <button class="primary" type="submit">Adicionar fornecedor</button>
    </form>
  </section>

  <section class="panel">
    <h2>Todos os fornecedores</h2>
    <div class="table">
      <div class="table-row table-head">
        <div>Nome</div>
        <div>Telefone</div>
        <div>Email</div>
        <div>Notas</div>
      </div>
      {% for s in suppliers %}
      <div class="table-row">
        <div>{{ s[1] }}</div>
        <div>{{ s[2] }}</div>
        <div>{{ s[3] }}</div>
        <div>{{ s[4] }}</div>
      </div>
      {% else %}
      <div class="table-row empty">Ainda não existem fornecedores.</div>
      {% endfor %}
    </div>
  </section>
{% endblock %}
