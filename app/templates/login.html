{% extends "base.html" %}
{% block content %}
  <section class="auth">
    <div class="auth-card">
      <h1>Entrar</h1>
      <p>Use a conta admin na primeira vez.</p>
      <form method="post" class="form">
        <label>
          Utilizador
          <input name="username" required />
        </label>
        <label>
          Palavra-passe
          <input name="password" type="password" required />
        </label>
        <button class="primary" type="submit">Entrar</button>
      </form>
      <div class="hint">
        Admin por defeito: <strong>admin</strong> / <strong>admin</strong>
      </div>
    </div>
  </section>
{% endblock %}
